name: 🔒 Build Kiosk Launcher APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: 🏗️ Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: 📦 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔍 Run Lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: 🛠️ Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 🚀 Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-launcher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-launcher-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: 📊 Generate Build Summary
        run: |
          echo "## 🔒 Kiosk Launcher Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 App ID | com.kiosklauncher.app |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Version | 1.0.0 |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Min SDK | 26 (Android 8.0) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Target SDK | 34 (Android 14) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **APK berhasil di-build dan tersedia di Artifacts!**" >> $GITHUB_STEP_SUMMARY

  release:
    name: 🚀 Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: kiosk-launcher-debug-${{ github.sha }}
          path: ./apk/

      - name: 🏷️ Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🔒 Kiosk Launcher v1.0.${{ github.run_number }}"
          body: |
            ## 🔒 Kiosk Launcher Release

            ### ✨ Fitur
            - 🏠 Home Screen Takeover - jadikan app lain sebagai launcher
            - 📱 App Picker dengan pencarian
            - 🔒 Navigation Lock (Back & Home button)
            - 📶 Status Bar Lock (fullscreen immersive)
            - 🛡️ Device Admin + Screen Pinning
            - ♿ Accessibility Service navigation guard
            - 🔄 Auto-start on boot
            - 🔐 Admin PIN protection

            ### 📦 Download
            Install `app-debug.apk` di perangkat Android (Android 8.0+)

            ### 📋 Cara Setup
            1. Install APK & set sebagai Default Launcher
            2. Pilih aplikasi kiosk
            3. Aktifkan Device Admin & Accessibility Service
            4. Toggle Kiosk Mode ON

            **Commit:** ${{ github.sha }}
          files: |
            ./apk/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
